---
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - MAINTAINERS.md
      - LICENSE
      - NOTICE
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  ci:
    uses: xmidt-org/shared-go/.github/workflows/ci.yml@2927c6f3ebb0f1fb32856842d21a3ef4ed80efe6 # v4.9.36
    with:
      release-type:   library
      yaml-lint-skip: true
    secrets: inherit
